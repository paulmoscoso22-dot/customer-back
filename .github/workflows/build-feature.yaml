name: Build and Test Feature Branch
on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened]

jobs:
  build-feature:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: pull checkout from repository
        run: echo "Pulling latest changes from repository"   

      # Set up Java environment
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # Correct distribution
          java-version: '17'   # Correct Java version


      - name: cache Maven dependencies
        uses: actions/cache@v3
        with:   
            path: ~/.m2/repository
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            restore-keys: |
                ${{ runner.os }}-maven-


      # Build with Maven
      - name: Build with Maven
        run: |
            mvn clean test package
            echo "Build with Maven completed"
        #   ./mvnw clean install
        #   echo "Build with Maven completed"

