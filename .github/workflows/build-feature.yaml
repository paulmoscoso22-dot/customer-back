name: build and test feature branch
on:
  pull_request:
    branches: [ develop ]
    types: [ opened, reopened ]
jobs: 
  build-feature:
    runs-on: ubuntu-latest
    steps:
      #############################################################
      # 2- dowload code from feature branch , setup java 8 and check that source code is buildable
      ########################################################
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: pull and checkout from git repository
        run: |
           echo "pulling and checking out from git repository"

      - name: setup java 17 
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: build with maven
        run: |
          echo "Working dir: $(pwd)"
          if [ -f pom.xml ]; then
            echo "Found pom.xml in current directory"
            mvn clean test package
          else
            echo "pom.xml not in current directory, searching..."
            POM_PATH=$(find . -maxdepth 5 -name pom.xml -print -quit)
            if [ -n "$POM_PATH" ]; then
              POM_DIR=$(dirname "$POM_PATH")
              echo "Found pom.xml at $POM_PATH, running mvn there"
              mvn -f "$POM_DIR/pom.xml" clean test package
            else
              echo "No pom.xml found in repository"
              ls -la
              exit 1
            fi
          fi
          echo "build with maven"




