name: build and test feature branch
on:
  pull_request:
    branches: [ develop ]
    types: [ opened, reopened ]
jobs:
  build-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug file presenti
        run: ls -la

      - name: Debug struttura directory
        run: find . -name "pom.xml" -maxdepth 4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        shell: bash
        run: |
          POM_DIR=$(find . -name "pom.xml" -maxdepth 4 | head -1 | xargs dirname)
          if [ -z "$POM_DIR" ]; then
            echo "ERRORE: pom.xml non trovato!"
            exit 1
          fi
          echo "Found pom.xml in: $POM_DIR"
          cd "$POM_DIR"
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw clean test package
          elif command -v mvn >/dev/null 2>&1; then
            mvn clean test package
          else
            echo "Maven non trovato."
            exit 1
          fi