name: Build and Test Feature Branch

on:
  push:
    branches:
      - feature/*

jobs:
  build-feature:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # Correct distribution
          java-version: '17'   # Correct Java version

      # Build with Maven
      - name: Build with Maven
        run: |
          ./mvnw clean install
          echo "Build with Maven completed"

      # Run tests
      - name: Run tests
        run: |
          ./mvnw test
          echo "Tests completed"




