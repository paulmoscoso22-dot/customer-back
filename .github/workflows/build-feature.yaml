name: Build and Test Feature Branch
on:
  push:
    branches:
      - feature/*

jobs:
  build-feature:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Ensure Maven wrapper exists
      - name: Ensure Maven wrapper exists
        run: |
          if [ ! -f ./customer-back/mvnw ]; then
            echo "Maven wrapper not found!"
            exit 1
          fi
      
      # Grant execute permissions to Maven wrapper
      - name: Grant execute permissions to Maven wrapper
        working-directory: ./customer-back
        run: chmod +x mvnw
      
      # Build with Maven
      - name: Build with Maven
        working-directory: ./customer-back
        run: |
          ./mvnw clean install
          echo "Build with Maven completed"
      
      # Run tests
      - name: Run tests
        working-directory: ./customer-back
        run: |
          ./mvnw test
          echo "Tests completed"




