name: Publish jar as artifact 
on:
  repository_dispatch:
    types: [publish-artifact-event]
jobs:
  dowlonad-artifact-job:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: 'customer-0.0.1-SNAPSHOT.jar'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    steps:      
      - name: Debug Payload
        run: echo ${{ github.event.client_payload.base_branch }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.base_branch }}
          fetch-depth: 0

      - name: check last hashid
        run: git log -2

      - name: setup java 17 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: build with maven
        run: mvn clean test package -DskipTests=true --batch-mode --update-snapshots

      - name: Debug target directory
        run: find . -name "*.jar" -maxdepth 5  

      - name: Publish Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: artifactjar
          path: ${{ github.workspace }}/target/${{ env.ARTIFACT_NAME }}

          